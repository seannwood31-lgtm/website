<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Pro — Tab Lock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#060609;--surface:#0f0f16;--surface2:#18181f;--border:#24242f;--accent:#ff4d00;--text:#ededf5;--muted:#64647a;--green:#00e676; }
  * { margin:0;padding:0;box-sizing:border-box; }
  body {
    background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  body::before {
    content:'';position:fixed;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,77,0,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,77,0,0.025) 1px,transparent 1px);
    background-size:48px 48px;
  }
  .card {
    position:relative;z-index:1;
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:52px 44px;max-width:500px;width:100%;text-align:center;
    box-shadow:0 60px 120px rgba(0,0,0,0.6);overflow:hidden;
  }
  .card::before {
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--green),#00b14f);
  }
  .glow {
    position:absolute;top:-100px;left:50%;transform:translateX(-50%);
    width:400px;height:400px;pointer-events:none;
    background:radial-gradient(circle,rgba(0,230,118,0.08) 0%,transparent 65%);
  }
  .icon { font-size:56px;margin-bottom:20px; }
  h1 {
    font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:900;
    text-transform:uppercase;line-height:0.9;margin-bottom:10px;
  }
  h1 span { color:var(--green); }
  .sub { color:var(--muted);font-size:15px;margin-bottom:36px; }

  .key-box {
    background:var(--surface2);border:1px solid var(--border);border-radius:12px;
    padding:22px;margin-bottom:8px;
  }
  .key-label {
    font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
    letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;
  }
  .key-value {
    font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;
    letter-spacing:2px;color:var(--text);word-break:break-all;margin-bottom:14px;
  }
  .copy-btn {
    padding:9px 24px;background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.25);
    color:var(--green);border-radius:6px;cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;
    letter-spacing:0.5px;transition:background 0.15s;
  }
  .copy-btn:hover { background:rgba(0,230,118,0.2); }
  .email-note { font-size:12px;color:var(--muted);margin-bottom:32px; }

  .steps-card {
    background:var(--surface2);border:1px solid var(--border);border-radius:10px;
    padding:20px;text-align:left;
  }
  .steps-title {
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;
    letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:16px;
  }
  .step { display:flex;gap:12px;align-items:flex-start;margin-bottom:12px; }
  .step:last-child { margin-bottom:0; }
  .step-num {
    width:24px;height:24px;border-radius:50%;flex-shrink:0;
    background:rgba(255,77,0,0.1);border:1px solid rgba(255,77,0,0.25);
    display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:var(--accent);
  }
  .step-text { font-size:14px;color:var(--muted);line-height:1.5; }
  .step-text strong { color:var(--text); }
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div>
  <div class="icon">🎉</div>
  <h1>You're <span>Pro</span></h1>
  <p class="sub">Welcome to Tab Lock Pro. Here's your license key.</p>

  <div class="key-box">
    <div class="key-label">Your License Key</div>
    <div class="key-value" id="license-key">{{LICENSE_KEY}}</div>
    <button class="copy-btn" onclick="copyKey()">Copy Key</button>
  </div>
  <p class="email-note">Also sent to {{EMAIL}}</p>

  <div class="steps-card">
    <div class="steps-title">Activate in 3 Steps</div>
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">Click the <strong>Tab Lock icon</strong> in your Chrome toolbar</div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text">Open <strong>Settings → Pro License</strong></div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text">Paste your key and click <strong>Activate</strong> ✓</div>
    </div>
  </div>
</div>

<script>
  function copyKey() {
    const key = document.getElementById("license-key").textContent;
    navigator.clipboard.writeText(key).then(() => {
      const btn = document.querySelector(".copy-btn");
      btn.textContent = "Copied!";
      setTimeout(() => btn.textContent = "Copy Key", 2000);
    });
  }
</script>
</body>
</html>
